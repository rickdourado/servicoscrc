<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Serviços — CRC Rio</title>
    
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Icons (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-alt: #f1f5f9;
            --accent: #004a80; /* Azul Prefeitura */
            --accent-hover: #003566;
            --accent-light: #e0f2fe;
            --orange: #f97316; /* Laranja CRC */
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: #e2e8f0;
            --radius-xl: 18px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow: 0 4px 12px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.02);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .navbar {
            background: var(--surface);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--accent);
        }

        .brand h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .nav-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.6rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,74,128,0.35); }
        .btn-primary:active { background: #002a52; transform: translateY(1px); box-shadow: 0 1px 4px rgba(0,74,128,0.25); }
        .btn-outline { background: white; border-color: var(--border); color: var(--text-sub); }
        .btn-outline:hover { background: var(--surface-alt); border-color: var(--accent); color: var(--accent); }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }

        /* MAIN CONTENT */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 1rem;
            gap: 1rem;
        }

        .column-system {
            flex: 1;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
        }

        .column {
            background: var(--surface);
            border-radius: var(--radius-xl);
            min-width: 350px;
            max-width: 480px;
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .column.hidden { opacity: 0.5; pointer-events: none; transform: scale(0.98); }

        .col-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .col-header h2 {
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .list-items {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 200px;
        }

        .item {
            padding: 0.85rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: var(--transition);
            user-select: none;
            position: relative;
        }

        .item:hover { border-color: var(--accent); background: var(--accent-light); }
        .item.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 12px rgba(0,74,128,0.2); }
        .item.drag-over { 
            border-color: var(--accent) !important; 
            border-width: 2px !important; 
            background: var(--accent-light) !important; 
            box-shadow: 0 0 0 4px var(--accent-glow) !important;
            transform: scale(1.02);
            z-index: 10;
        }

        /* Esconde o "espaço vazio" (ghost) quando arrastamos um subtema para a coluna de temas */
        #list-themes .sortable-ghost { display: none !important; }
        #list-subthemes .sortable-ghost { display: none !important; }
        
        .item-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .item.active .item-icon { color: white; }
        .item.active .item-arrow { color: rgba(255,255,255,0.6); }

        .item-name { 
            flex: 1; 
            font-size: 0.875rem; 
            font-weight: 600; 
            line-height: 1.3;
            padding-right: 0.5rem; 
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .item-edit { font-size: 0.85rem; color: var(--text-sub); cursor: pointer; transition: var(--transition); padding: 0.4rem; border-radius: var(--radius-md); opacity: 0; }
        .item:hover .item-edit { opacity: 1; }
        .item-edit:hover { background: var(--surface-alt); color: var(--accent); }
        .item.active .item-edit { color: rgba(255,255,255,0.8); }
        .item.active .item-edit:hover { background: rgba(255,255,255,0.2); color: white; }
        .item-arrow { font-size: 0.75rem; color: var(--text-sub); transition: var(--transition); margin-left: 0.25rem; }

        /* MODAL DE EDIÇÃO */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; transition: var(--transition);
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--surface); width: 90%; max-width: 500px;
            border-radius: var(--radius-xl); padding: 2rem; box-shadow: var(--shadow-lg);
            display: flex; flex-direction: column; gap: 1.5rem;
            transform: scale(0.95); transition: var(--transition);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
        .btn-close { background: transparent; border: none; font-size: 1.2rem; color: var(--text-sub); cursor: pointer; transition: var(--transition); }
        .btn-close:hover { color: var(--text-main); transform: scale(1.1); }
        
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-sub); }
        .form-input, .form-textarea {
            width: 100%; padding: 0.75rem; border-radius: var(--radius-md);
            border: 1px solid var(--border); font-family: inherit; font-size: 0.9rem; transition: var(--transition);
        }
        .form-input:focus, .form-textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-light); }
        .ai-btn-wrapper { display: flex; justify-content: space-between; align-items: center; }
        .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
        .modal-actions-right { display: flex; gap: 0.75rem; }

        .footer-bottom {
            display: flex;
            justify-content: center;
            gap: 1rem;
            align-items: center;
        }
        
        /* UTILS */
        .badge-type { font-size: 0.7rem; font-weight: 900; text-transform: uppercase; color: var(--text-sub); margin-bottom: 0.25rem; }

        /* TOAST */
        .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            border-left: 4px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
            min-width: 250px;
        }
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* BUSCA N3 */
        .services-header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .search-services-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-services-icon {
            position: absolute;
            left: 0.55rem;
            font-size: 0.75rem;
            color: var(--text-sub);
            pointer-events: none;
        }
        .search-services-input {
            padding: 0.3rem 0.6rem 0.3rem 1.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.8rem;
            width: 150px;
            transition: var(--transition);
            background: var(--surface-alt);
            color: var(--text-main);
        }
        .search-services-input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 3px var(--accent-light);
            width: 180px;
        }
        .search-services-input::placeholder { color: var(--text-sub); }

        /* MODAL MOVER SERVIÇO */
        #move-modal .modal-content { max-width: 460px; }
        .move-modal-service-name {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-main);
            background: var(--surface-alt);
            border-radius: var(--radius-md);
            padding: 0.6rem 0.9rem;
            border-left: 4px solid var(--orange);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .move-modal-arrow {
            text-align: center;
            font-size: 1.4rem;
            color: var(--accent);
            line-height: 1;
        }
        #move-theme-select, #move-subtheme-select {
            width: 100%;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
            background: white;
            cursor: pointer;
        }
        #move-theme-select:focus, #move-subtheme-select:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        #move-subtheme-select:disabled { opacity: 0.5; cursor: not-allowed; }
        .item-move {
            font-size: 0.85rem;
            color: var(--text-sub);
            cursor: pointer;
            transition: var(--transition);
            padding: 0.4rem;
            border-radius: var(--radius-md);
            opacity: 0;
        }
        .item:hover .item-move { opacity: 1; }
        .item-move:hover { background: var(--surface-alt); color: var(--orange); }
        .item.active .item-move { color: rgba(255,255,255,0.8); }
        .item.active .item-move:hover { background: rgba(255,255,255,0.2); color: white; }

        /* LOADING */
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
            visibility: hidden; opacity: 0; transition: var(--transition);
        }
        .loading-overlay.active { visibility: visible; opacity: 1; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--accent-light); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="gov-top-bar">
        <div class="brand-text">
            <strong>RIO</strong> <span>|</span> PREFEITURA
        </div>
        <a href="https://www.1746.rio/hc/pt-br" target="_blank" class="official-tag" style="text-decoration: none; color: inherit;">Visitar Site Oficial ➔</a>
    </div>

    <header class="gov-header">
        <div class="gov-branding">
            <img class="gov-logo" src="https://www.1746.rio/hc/theming_assets/01K8VJ5HYS34A9B2Q0N4QR6CXJ" alt="Logo Prefeitura">
            <div class="gov-separator"></div>
            <a href="index.html" class="brand" style="text-decoration: none;">
                <div class="portal-name">
                    <span class="portal-title">CRC</span>
                    <span class="portal-subtitle">Coordenadoria de Relacionamento com o Cidadão</span>
                </div>
            </a>
        </div>
        <div class="nav-actions">
            <!-- Versões -->
            <div class="version-control" style="display: flex; gap: 0.5rem; align-items: center; background: var(--surface-alt); padding: 0.3rem 0.6rem; border-radius: var(--radius-md); border: 1px solid var(--border);">
                <label style="font-size: 0.7rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase;">Versão:</label>
                <select id="version-select" onchange="loadSpecificVersion()" class="form-input" style="padding: 0.2rem; width: 160px; font-size: 0.8rem; background: white;">
                    <option value="live">Atual (servicos.json)</option>
                </select>
                <button onclick="updateVersionsList()" class="btn btn-outline" style="padding: 0.3rem; border: none; background: transparent;" title="Atualizar Lista">
                    <i class="fa-solid fa-sync"></i>
                </button>
            </div>

            <button onclick="restoreOriginal()" class="btn btn-warning">
                <i class="fa-solid fa-rotate-left"></i> Restaurar Inicial
            </button>
            <button onclick="saveChanges()" class="btn btn-primary">
                <i class="fa-solid fa-save"></i> Salvar Versão
            </button>
            <button onclick="exportToExcel()" class="btn btn-outline" title="Baixar Backup Excel">
                <i class="fa-solid fa-file-excel"></i> Exportar
            </button>
        </div>
    </header>

    <main class="main-container">
        <div class="column-system">
            <!-- NÍVEL 1: TEMAS -->
            <section class="column" id="col-themes">
                <div class="col-header">
                    <h2><i class="fa-solid fa-layer-group"></i> Nivel 1: Temas</h2>
                    <button class="btn btn-outline" style="padding: 0.3rem 0.6rem" onclick="addItem('theme')">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <div class="list-items" id="list-themes"></div>
            </section>

            <!-- NÍVEL 2: SUBTEMAS -->
            <section class="column hidden" id="col-subthemes">
                <div class="col-header">
                    <h2><i class="fa-solid fa-folder-tree"></i> Nivel 2: Subtemas</h2>
                    <button class="btn btn-outline" style="padding: 0.3rem 0.6rem" onclick="addItem('subtheme')">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <div class="list-items" id="list-subthemes"></div>
            </section>

            <!-- NÍVEL 3: SERVIÇOS -->
            <section class="column hidden" id="col-services">
                <div class="col-header">
                    <h2><i class="fa-solid fa-circle-dot"></i> Nivel 3: Serviços</h2>
                    <div class="services-header-actions">
                        <div class="search-services-wrapper">
                            <i class="fa-solid fa-magnifying-glass search-services-icon"></i>
                            <input type="text" id="search-services" class="search-services-input" placeholder="Buscar serviço..." oninput="filterServices(this.value)">
                        </div>
                        <button class="btn btn-outline" style="padding: 0.3rem 0.6rem" onclick="addItem('service')">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="list-items" id="list-services"></div>
            </section>
        </div>

        <!-- MODAL DE EDIÇÃO -->
        <div class="modal-overlay" id="edit-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Editar <span id="ins-badge" class="badge-type" style="margin-left: 0.5rem; font-size: 0.8rem;">Tema</span></div>
                    <button class="btn-close" onclick="closeEditModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Nome</label>
                    <input type="text" id="ins-name" class="form-input">
                </div>

                <div class="form-group" id="group-desc">
                    <div class="ai-btn-wrapper">
                        <label class="form-label">Descrição para o Cidadão</label>
                        <button onclick="generateAIDesc()" class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.7rem; border-color: var(--orange); color: var(--orange);">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Gerar com IA
                        </button>
                    </div>
                    <textarea id="ins-desc" class="form-textarea" rows="4" placeholder="Uma frase curta e objetiva..."></textarea>
                </div>

                <div class="modal-actions">
                    <button onclick="deleteItem()" class="btn btn-danger btn-outline" style="border: none;">
                        <i class="fa-solid fa-trash-alt"></i> Excluir
                    </button>
                    <div class="modal-actions-right">
                        <button onclick="closeEditModal()" class="btn btn-outline">Cancelar</button>
                        <button onclick="saveEditModal()" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- MODAL MOVER SERVIÇO (N3 → qualquer N2) -->
        <div class="modal-overlay" id="move-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title"><i class="fa-solid fa-arrows-up-down-left-right" style="color: var(--orange); margin-right: 0.5rem;"></i> Mover Serviço</div>
                    <button class="btn-close" onclick="closeMoveModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="form-group">
                    <label class="form-label">Serviço sendo movido</label>
                    <div class="move-modal-service-name" id="move-service-name"></div>
                </div>

                <div class="move-modal-arrow"><i class="fa-solid fa-arrow-down"></i></div>

                <div class="form-group">
                    <label class="form-label">Tema destino (N1)</label>
                    <select id="move-theme-select" onchange="populateMoveSubthemes()">
                        <option value="">— Selecione um Tema —</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Subtema destino (N2)</label>
                    <select id="move-subtheme-select" disabled>
                        <option value="">— Selecione um Subtema —</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button onclick="closeMoveModal()" class="btn btn-outline">Cancelar</button>
                    <button onclick="confirmMove()" class="btn btn-primary">
                        <i class="fa-solid fa-check"></i> Confirmar Movimentação
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toasts"></div>
    <div class="loading-overlay" id="loader"><div class="spinner"></div></div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        let appData = [];
        let selectedThemeId = null;
        let selectedSubthemeId = null;
        let selectedServiceId = null;

        let activeItem = null;
        let activeType = null;

        const API_BASE = '/api';

        // Load Data
        async function loadData() {
            showLoader(true);
            try {
                const res = await fetch(`${API_BASE}/servicos-organizacao`);
                const data = await res.json();
                appData = data.items || [];
                renderThemes();
                await updateVersionsList();
            } catch (e) {
                showToast('Erro ao carregar dados', 'error');
            } finally {
                showLoader(false);
            }
        }

        async function updateVersionsList() {
            try {
                const res = await fetch(`${API_BASE}/list-versions`);
                const data = await res.json();
                const select = document.getElementById('version-select');
                
                // Mantém apenas a opção "live" e adiciona as novas
                select.innerHTML = '<option value="live">Atual (servicos.json)</option>';
                
                if (data.versions && data.versions.length > 0) {
                    data.versions.forEach(v => {
                        const opt = document.createElement('option');
                        opt.value = v;
                        opt.textContent = v;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                console.error("Erro ao carregar lista de versões:", e);
            }
        }

        async function loadSpecificVersion() {
            const version = document.getElementById('version-select').value;
            showLoader(true);
            try {
                let url = `${API_BASE}/servicos-organizacao`;
                if (version !== 'live') {
                    url = `${API_BASE}/load-version/${version}`;
                }
                
                const res = await fetch(url);
                const data = await res.json();
                
                // Se a versão for customizada, ela pode retornar o objeto com .items ou o array direto
                appData = data.items || data;
                
                // Reset de seleção
                selectedThemeId = null;
                selectedSubthemeId = null;
                selectedServiceId = null;
                
                renderThemes();
                renderSubthemes();
                renderServices();
                
                showToast(`Versão ${version === 'live' ? 'atual' : version} carregada!`, 'success');
            } catch (e) {
                showToast('Erro ao carregar versão', 'error');
            } finally {
                showLoader(false);
            }
        }

        // NAVIGATION & RENDERING
        function renderThemes() {
            const list = document.getElementById('list-themes');
            list.innerHTML = '';
            appData.forEach(theme => {
                const el = createItemEl(theme, 'theme', theme.id === selectedThemeId);
                el.onclick = () => selectTheme(theme.id);
                list.appendChild(el);
            });
            initSortableThemes();
        }

        function selectTheme(id) {
            selectedThemeId = id;
            selectedSubthemeId = null;
            selectedServiceId = null;
            const theme = appData.find(t => t.id === id);
            renderThemes();
            renderSubthemes();
        }

        function renderSubthemes() {
            const col = document.getElementById('col-subthemes');
            const list = document.getElementById('list-subthemes');
            list.innerHTML = '';
            
            if (!selectedThemeId) { col.classList.add('hidden'); return; }
            col.classList.remove('hidden');

            const theme = appData.find(t => t.id === selectedThemeId);
            theme.subthemes.forEach(sub => {
                const el = createItemEl(sub, 'subtheme', sub.id === selectedSubthemeId);
                el.onclick = () => selectSubtheme(sub.id);
                list.appendChild(el);
            });

            initSortableSubthemes();
            renderServices();
        }

        function selectSubtheme(id) {
            selectedSubthemeId = id;
            selectedServiceId = null;
            const searchInput = document.getElementById('search-services');
            if (searchInput) searchInput.value = '';
            const theme = appData.find(t => t.id === selectedThemeId);
            const sub = theme.subthemes.find(s => s.id === id);
            renderSubthemes();
        }

        function renderServices() {
            const col = document.getElementById('col-services');
            const list = document.getElementById('list-services');
            list.innerHTML = '';
            
            if (!selectedSubthemeId) { col.classList.add('hidden'); return; }
            col.classList.remove('hidden');

            const theme = appData.find(t => t.id === selectedThemeId);
            const sub = theme.subthemes.find(s => s.id === selectedSubthemeId);
            
            sub.services.forEach(srv => {
                const el = createItemEl(srv, 'service', srv.id === selectedServiceId);
                el.onclick = () => selectService(srv.id);
                list.appendChild(el);
            });

            initSortableServices();
        }

        function selectService(id) {
            selectedServiceId = id;
            const theme = appData.find(t => t.id === selectedThemeId);
            const sub = theme.subthemes.find(s => s.id === selectedSubthemeId);
            const srv = sub.services.find(s => s.id === id);
            renderServices();
        }

        function createItemEl(item, type, isActive) {
            const div = document.createElement('div');
            div.className = `item ${isActive ? 'active' : ''}`;
            div.dataset.id = item.id;
            div.dataset.type = type;
            
            // Eventos nativos para o destaque "estilo pasta"
            if (type === 'theme' || type === 'subtheme') {
                div.ondragover = (e) => {
                    e.preventDefault();
                    div.classList.add('drag-over');
                    activeDropTargetId = item.id;
                };
                div.ondragleave = () => {
                    div.classList.remove('drag-over');
                };
                div.ondrop = () => {
                    div.classList.remove('drag-over');
                };
            }

            let icon = 'fa-layer-group';
            if (type === 'subtheme') icon = 'fa-folder-tree';
            if (type === 'service') icon = 'fa-circle-dot';

            const moveBtnHtml = (type === 'service')
                ? `<i class="fa-solid fa-arrows-up-down-left-right item-move" onclick="openMoveModal(event, '${item.id}')" title="Mover para outro subtema"></i>`
                : '';
            div.innerHTML = `
                <div class="item-icon"><i class="fa-solid ${icon}"></i></div>
                <span class="item-name" title="${item.name || 'Sem nome'}">${item.name || 'Sem nome'}</span>
                ${moveBtnHtml}
                <i class="fa-solid fa-pen item-edit" onclick="openEditModal(event, '${item.id}', '${type}')" title="Editar"></i>
                <i class="fa-solid fa-chevron-right item-arrow"></i>
            `;
            return div;
        }

        // SORTABLES & DRAG LOGIC
        let activeDropTargetId = null;

        function initSortableThemes() {
            const el = document.getElementById('list-themes');
            if (el.sortable) el.sortable.destroy();
            el.sortable = new Sortable(el, {
                group: { name: 'themes', put: ['subthemes'] },
                animation: 150,
                onEnd: (evt) => {
                    document.querySelectorAll('#list-themes .item').forEach(i => i.classList.remove('drag-over'));
                    // Se for reordenação de temas (mesma lista)
                    if (evt.from === evt.to && evt.item.dataset.type === 'theme') {
                        const ids = Array.from(el.children).filter(c => c.dataset.type === 'theme').map(c => c.dataset.id);
                        appData = ids.map(id => appData.find(t => t.id === id));
                    }
                },
                onAdd: (evt) => {
                    // Quando um subtema é "solto" na coluna de temas
                    const subId = evt.item.dataset.id;
                    const fromTheme = appData.find(t => t.id === selectedThemeId);
                    const subIndex = fromTheme.subthemes.findIndex(s => s.id === subId);
                    const subthemeObj = fromTheme.subthemes.splice(subIndex, 1)[0];
                    
                    // Usa o alvo capturado pelos eventos nativos
                    const targetTheme = appData.find(t => t.id === activeDropTargetId);
                    
                    if (targetTheme && targetTheme.id !== fromTheme.id) {
                        targetTheme.subthemes.push(subthemeObj);
                        showToast(`Movido para ${targetTheme.name}`, 'success');
                    } else {
                        fromTheme.subthemes.splice(subIndex, 0, subthemeObj);
                        showToast('Movimentação cancelada', 'error');
                    }
                    
                    // Cleanup visual
                    evt.item.remove();
                    document.querySelectorAll('#list-themes .item').forEach(i => i.classList.remove('drag-over'));
                    
                    renderThemes();
                    renderSubthemes();
                    activeDropTargetId = null;
                }
            });
        }

        function initSortableSubthemes() {
            const el = document.getElementById('list-subthemes');
            if (el.sortable) el.sortable.destroy();
            el.sortable = new Sortable(el, {
                group: { name: 'subthemes', pull: true, put: true, put: ['services'] },
                animation: 150,
                onEnd: (evt) => {
                    document.querySelectorAll('#list-subthemes .item').forEach(i => i.classList.remove('drag-over'));
                    // Se foi movido dentro da própria lista
                    if(evt.to === evt.from && evt.item.dataset.type === 'subtheme') {
                        const theme = appData.find(t => t.id === selectedThemeId);
                        const ids = Array.from(el.children).map(c => c.dataset.id);
                        theme.subthemes = ids.map(id => theme.subthemes.find(s => s.id === id));
                    }
                },
                onAdd: (evt) => {
                    // Quando um serviço é "solto" na coluna de subtemas
                    const serviceId = evt.item.dataset.id;
                    const fromTheme = appData.find(t => t.id === selectedThemeId);
                    const fromSubtheme = fromTheme.subthemes.find(s => s.id === selectedSubthemeId);
                    
                    const serviceIndex = fromSubtheme.services.findIndex(s => s.id === serviceId);
                    const serviceObj = fromSubtheme.services.splice(serviceIndex, 1)[0];
                    
                    // Usa o alvo capturado pelos eventos nativos
                    const targetSubtheme = fromTheme.subthemes.find(s => s.id === activeDropTargetId);
                    
                    if (targetSubtheme && targetSubtheme.id !== fromSubtheme.id) {
                        targetSubtheme.services.push(serviceObj);
                        showToast(`Serviço movido para ${targetSubtheme.name}`, 'success');
                    } else {
                        fromSubtheme.services.splice(serviceIndex, 0, serviceObj);
                        showToast('Movimentação cancelada', 'error');
                    }
                    
                    // Cleanup visual
                    evt.item.remove();
                    document.querySelectorAll('#list-subthemes .item').forEach(i => i.classList.remove('drag-over'));
                    
                    renderSubthemes();
                    renderServices();
                    activeDropTargetId = null;
                }
            });
        }

        function initSortableServices() {
            const el = document.getElementById('list-services');
            if (el.sortable) el.sortable.destroy();
            el.sortable = new Sortable(el, {
                group: { name: 'services', pull: true, put: true },
                animation: 150,
                onEnd: (evt) => {
                    const theme = appData.find(t => t.id === selectedThemeId);
                    const sub = theme.subthemes.find(s => s.id === selectedSubthemeId);
                    const ids = Array.from(el.children).map(c => c.dataset.id);
                    sub.services = ids.map(id => sub.services.find(s => s.id === id));
                }
            });
        }

        // MODAL & ACTIONS
        function openEditModal(event, id, type) {
            event.stopPropagation(); // Evita navegar ao clicar em editar
            
            // Encontra o item
            let item;
            if (type === 'theme') {
                item = appData.find(t => t.id === id);
            } else if (type === 'subtheme') {
                const theme = appData.find(t => t.id === selectedThemeId);
                item = theme.subthemes.find(s => s.id === id);
            } else {
                const theme = appData.find(t => t.id === selectedThemeId);
                const sub = theme.subthemes.find(s => s.id === selectedSubthemeId);
                item = sub.services.find(s => s.id === id);
            }

            if (!item) return;

            activeItem = item;
            activeType = type;
            
            document.getElementById('ins-badge').textContent = type;
            document.getElementById('ins-name').value = item.name || '';
            document.getElementById('ins-desc').value = item.description || '';
            document.getElementById('group-desc').style.display = type === 'service' ? 'none' : 'flex';
            
            document.getElementById('edit-modal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
            activeItem = null;
            activeType = null;
        }

        function saveEditModal() {
            if (!activeItem) return;
            
            const newName = document.getElementById('ins-name').value;
            const newDesc = document.getElementById('ins-desc').value;
            
            activeItem.name = newName;
            if (activeType !== 'service') {
                activeItem.description = newDesc;
            }
            
            // Atualiza a UI da lista
            if (activeType === 'theme') renderThemes();
            else if (activeType === 'subtheme') renderSubthemes();
            else renderServices();
            
            closeEditModal();
        }

        async function generateAIDesc() {
            if (!activeItem || activeType === 'service') return;
            showLoader(true);
            try {
                let parent = '';
                if (activeType === 'subtheme') parent = appData.find(t => t.id === selectedThemeId).name;
                const res = await fetch(`${API_BASE}/ai/generate-description`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: activeType, name: activeItem.name, parent_name: parent })
                });
                const data = await res.json();
                if (data.description) {
                    activeItem.description = data.description;
                    document.getElementById('ins-desc').value = data.description;
                    showToast('Descrição gerada!', 'success');
                } else showToast(data.error || 'Erro na IA', 'error');
            } catch (e) { showToast('Erro ao contatar IA', 'error'); }
            finally { showLoader(false); }
        }

        function addItem(type) {
            const newId = Math.random().toString(36).substr(2, 9);
            const newItem = { id: newId, name: 'Novo ' + type, description: '' };
            if (type === 'theme') {
                newItem.subthemes = [];
                appData.push(newItem);
                renderThemes();
                selectTheme(newId);
            } else if (type === 'subtheme') {
                if(!selectedThemeId) return showToast('Selecione um Tema antes', 'error');
                newItem.services = [];
                appData.find(t => t.id === selectedThemeId).subthemes.push(newItem);
                renderSubthemes();
                selectSubtheme(newId);
            } else {
                if(!selectedSubthemeId) return showToast('Selecione um Subtema antes', 'error');
                appData.find(t => t.id === selectedThemeId).subthemes.find(s => s.id === selectedSubthemeId).services.push(newItem);
                renderServices();
                selectService(newId);
            }
        }

        function deleteItem() {
            if (!activeItem || !confirm('Deseja realmente excluir este item?')) return;
            if (activeType === 'theme') {
                appData = appData.filter(t => t.id !== activeItem.id);
                selectedThemeId = null;
                renderThemes();
            } else if (activeType === 'subtheme') {
                const theme = appData.find(t => t.id === selectedThemeId);
                theme.subthemes = theme.subthemes.filter(s => s.id !== activeItem.id);
                selectedSubthemeId = null;
                renderSubthemes();
            } else {
                const theme = appData.find(t => t.id === selectedThemeId);
                const sub = theme.subthemes.find(s => s.id === selectedSubthemeId);
                sub.services = sub.services.filter(s => s.id !== activeItem.id);
                selectedServiceId = null;
                renderServices();
            }
            closeEditModal();
        }

        async function saveChanges() {
            showLoader(true);
            try {
                const res = await fetch(`${API_BASE}/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: appData })
                });
                const result = await res.json();
                if (res.ok) {
                    showToast(`Versão ${result.version} salva com sucesso!`, 'success');
                    await updateVersionsList();
                    // Seleciona a versão recém criada
                    document.getElementById('version-select').value = result.version;
                } else {
                    showToast('Erro ao salvar', 'error');
                }
            } catch (e) { showToast('Erro de conexão', 'error'); }
            finally { showLoader(false); }
        }

        async function restoreOriginal() {
            if(!confirm('Isso resetará todas as descrições e a ordem para o estado inicial. Prosseguir?')) return;
            showLoader(true);
            try {
                const res = await fetch(`${API_BASE}/restore-original`, { method: 'POST' });
                const data = await res.json();
                if(data.items) {
                    appData = data.items;
                    selectedThemeId = null;
                    selectedSubthemeId = null;
                    selectedServiceId = null;
                    renderThemes();
                    renderSubthemes();
                    showToast('Dados restaurados!', 'success');
                } else showToast(data.error || 'Erro ao restaurar', 'error');
            } catch(e) { showToast('Erro ao restaurar', 'error'); }
            finally { showLoader(false); }
        }

        function exportToExcel() {
            const rows = [['Tema', 'Descrição Tema', 'Subtema', 'Descrição Subtema', 'Serviço']];
            appData.forEach(t => {
                if (t.subthemes.length === 0) rows.push([t.name, t.description, '', '', '']);
                else t.subthemes.forEach(s => {
                    if (s.services.length === 0) rows.push([t.name, t.description, s.name, s.description, '']);
                    else s.services.forEach(srv => rows.push([t.name, t.description, s.name, s.description, srv.name]));
                });
            });
            const ws = XLSX.utils.aoa_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Hierarquia");
            XLSX.writeFile(wb, "Servicos_CRC_Export.xlsx");
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toasts');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function filterServices(query) {
            const q = query.trim().toLowerCase();
            document.querySelectorAll('#list-services .item').forEach(el => {
                const name = el.querySelector('.item-name')?.textContent.toLowerCase() || '';
                el.style.display = (!q || name.includes(q)) ? '' : 'none';
            });
        }

        function showLoader(show) { document.getElementById('loader').classList.toggle('active', show); }

        // ── MODAL MOVER SERVIÇO (N3 → qualquer N2) ──────────────────────────
        let moveServiceId = null;    // ID do serviço sendo movido
        let moveFromThemeId = null;  // N1 de origem
        let moveFromSubthemeId = null; // N2 de origem

        function openMoveModal(event, serviceId) {
            event.stopPropagation();

            // Localiza o serviço na árvore completa
            let foundService = null, foundTheme = null, foundSubtheme = null;
            for (const theme of appData) {
                for (const sub of theme.subthemes) {
                    const srv = sub.services.find(s => s.id === serviceId);
                    if (srv) {
                        foundService = srv;
                        foundTheme = theme;
                        foundSubtheme = sub;
                        break;
                    }
                }
                if (foundService) break;
            }
            if (!foundService) return showToast('Serviço não encontrado', 'error');

            moveServiceId = serviceId;
            moveFromThemeId = foundTheme.id;
            moveFromSubthemeId = foundSubtheme.id;

            document.getElementById('move-service-name').textContent = foundService.name;

            // Popula temas
            const themeSelect = document.getElementById('move-theme-select');
            themeSelect.innerHTML = '<option value="">— Selecione um Tema —</option>';
            appData.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.name;
                themeSelect.appendChild(opt);
            });

            // Reseta subtemas
            const subSelect = document.getElementById('move-subtheme-select');
            subSelect.innerHTML = '<option value="">— Selecione um Subtema —</option>';
            subSelect.disabled = true;

            document.getElementById('move-modal').classList.add('active');
        }

        function populateMoveSubthemes() {
            const themeId = document.getElementById('move-theme-select').value;
            const subSelect = document.getElementById('move-subtheme-select');
            subSelect.innerHTML = '<option value="">— Selecione um Subtema —</option>';

            if (!themeId) { subSelect.disabled = true; return; }

            const theme = appData.find(t => t.id === themeId);
            if (!theme || theme.subthemes.length === 0) {
                subSelect.innerHTML = '<option value="">Nenhum subtema disponível</option>';
                subSelect.disabled = true;
                return;
            }

            theme.subthemes.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.id;
                // Marca o subtema de origem para orientação
                const isOrigin = (sub.id === moveFromSubthemeId && themeId === moveFromThemeId);
                opt.textContent = sub.name + (isOrigin ? ' (origem atual)' : '');
                subSelect.appendChild(opt);
            });
            subSelect.disabled = false;
        }

        function confirmMove() {
            const targetThemeId = document.getElementById('move-theme-select').value;
            const targetSubthemeId = document.getElementById('move-subtheme-select').value;

            if (!targetThemeId) return showToast('Selecione um Tema destino', 'error');
            if (!targetSubthemeId) return showToast('Selecione um Subtema destino', 'error');
            if (targetSubthemeId === moveFromSubthemeId) {
                return showToast('O serviço já está neste subtema', 'error');
            }

            // Localiza origem e remove o serviço
            const fromTheme = appData.find(t => t.id === moveFromThemeId);
            const fromSub = fromTheme.subthemes.find(s => s.id === moveFromSubthemeId);
            const srvIdx = fromSub.services.findIndex(s => s.id === moveServiceId);
            if (srvIdx === -1) return showToast('Erro: serviço não encontrado na origem', 'error');
            const [serviceObj] = fromSub.services.splice(srvIdx, 1);

            // Insere no destino
            const targetTheme = appData.find(t => t.id === targetThemeId);
            const targetSub = targetTheme.subthemes.find(s => s.id === targetSubthemeId);
            targetSub.services.push(serviceObj);

            showToast(`"${serviceObj.name}" movido para ${targetTheme.name} › ${targetSub.name}`, 'success');
            closeMoveModal();

            // Re-renderiza — atualiza a visão conforme o contexto atual
            renderThemes();
            renderSubthemes();
            renderServices();
        }

        function closeMoveModal() {
            document.getElementById('move-modal').classList.remove('active');
            moveServiceId = null;
            moveFromThemeId = null;
            moveFromSubthemeId = null;
        }
        // ────────────────────────────────────────────────────────────────────

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
